  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f7f6f3; --line: #e4e1db; --text: #141414; --muted: #6e6b66; --accent: #e8590c; --accent-text: #c2410c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: var(--bg); color: var(--text); font: 17px/1.65 "Space Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 34rem; }
    .code { font: 500 0.78rem "JetBrains Mono", ui-monospace, monospace; color: var(--accent-text); text-transform: uppercase; letter-spacing: 0.1em; }
    .code::before { content: "■ "; color: var(--accent); }
    h1 { font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1.05; font-weight: 600; letter-spacing: -0.03em; margin: 1rem 0; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); margin: 0; }
    a.btn { display: inline-block; margin-top: 2rem; padding: 0.9rem 1.4rem; border-radius: 10px; background: var(--text); color: #fff; font: 500 0.9rem "JetBrains Mono", ui-monospace, monospace; text-decoration: none; }
    a.btn:hover { background: var(--accent-text); }
    a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404 · not found</p>
    <h1>This page doesn't <span>exist</span>.</h1>

  </main>
</body>
